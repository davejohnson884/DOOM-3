name: Build Q4BSE V19Y Lightning Ammo Dark Matter Order

on:
  workflow_dispatch:
  push:
    branches:
      - q4bse-v19y-lg-ammo-darkmatter-order
    paths:
      - 'q4bse_port/apply_q4bse_v19y_lightning_ammo_darkmatter_order.py'
      - '.github/workflows/build-q4bse-v19y-lightning-ammo-darkmatter-order.yml'

permissions:
  contents: read

jobs:
  build-game-dll:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout V19Y branch
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply accepted cumulative Q4BSE pipeline through V19L
        shell: powershell
        run: python q4bse_port/run_q4bse_v19k_pipeline.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19N source-driven Lightning Gun runtime
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19n_lightninggun_runtime.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19O Lightning Gun parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19o_lightninggun_parity.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19P runtime parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19p_lightninggun_runtime.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19Q sustained shake and dynamic lighting overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19q_lightninggun_lighting.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19R lighting visibility fix
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19r_lightninggun_lighting_fix.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19S impact and crawl parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19s_lightninggun_impact_parity.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19V empty Lightning Gun selection fix
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19v_lightninggun_allow_empty_select.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19W2 separate Lightning Gun slot 13
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19w_lightninggun_separate_slot.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19X independent Lightning Gun script loader
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19x_lightninggun_self_contained_script.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19Y dedicated ammo and Dark Matter ordering
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19y_lightning_ammo_darkmatter_order.py "$env:GITHUB_WORKSPACE"

      - name: Verify V19Y source gates
        shell: powershell
        run: |
          Select-String -Path neo\game\Player.cpp -Pattern 'spawnArgs.Set\( "def_weapon8", "" \)'
          Select-String -Path neo\game\Player.cpp -Pattern 'spawnArgs.Set\( "def_weapon13", "weapon_lightninggun" \)'
          Select-String -Path neo\game\Player.cpp -Pattern 'spawnArgs.Set\( "def_weapon14", "weapon_bfg" \)'
          Select-String -Path neo\game\Player.cpp -Pattern 'spawnArgs.Set\( "max_ammo_lightninggun", "400" \)'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'ammoname, "ammo_lightninggun"'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'return \( ammo_t \)10;'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'return "ammo_lightninggun";'
          Select-String -Path neo\game\script\Script_Program.cpp -Pattern 'CompileFile\( "script/weapon_lightninggun.script" \);'
          Select-String -Path neo\game\Player.cpp -Pattern 'inventory.HasAmmo\( weap \) \|\| !idStr::Icmp\( weap, "weapon_lightninggun" \)'
          Select-String -Path neo\game\Player.cpp -Pattern 'animPrefix = "weapon_plasmagun"'

      - name: Build Game Win32 Release
        shell: powershell
        run: msbuild neo\game.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /verbosity:minimal

      - name: Verify gamex86.dll
        shell: powershell
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'build\Win32\Release\gamex86.dll'
          if (!(Test-Path $dll)) { throw 'gamex86.dll was not produced' }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime
          Get-FileHash $dll -Algorithm SHA256

      - name: Stage V19Y artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build\Win32\Release\gamex86.dll artifact\gamex86.dll
          Copy-Item neo\game\Player.cpp artifact\Player.cpp
          Copy-Item neo\game\Weapon.cpp artifact\Weapon.cpp
          Copy-Item neo\game\script\Script_Program.cpp artifact\Script_Program.cpp
          @"
          Q4BSE V19Y LIGHTNING AMMO + DARK MATTER ORDER
          =================================================
          Base: accepted V19X self-contained Lightning Gun.
          V19Y changes:
          - Lightning Gun remains slot 13
          - weapon_bfg / Q4 Dark Matter Gun moves from slot 8 to slot 14
          - scroll order therefore reaches Lightning -> Dark Matter
          - ammo_lightninggun is a dedicated inventory ammo bucket at index 10
          - max Lightning reserve is 400
          - stock reload/next/previous impulses 13/14/15 are untouched
          "@ | Set-Content artifact\README_TEST.txt

      - name: Upload V19Y artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q4BSE-V19Y-LightningAmmo-DarkMatterOrder
          path: artifact/
          if-no-files-found: error
