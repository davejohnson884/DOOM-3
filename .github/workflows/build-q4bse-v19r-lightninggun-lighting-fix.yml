name: Build Q4BSE V19R Lightning Gun Lighting Fix

on:
  workflow_dispatch:
  push:
    branches:
      - q4bse-v19r-lg-lighting-fix
    paths:
      - 'q4bse_port/apply_q4bse_v19r_lightninggun_lighting_fix.py'
      - '.github/workflows/build-q4bse-v19r-lightninggun-lighting-fix.yml'

permissions:
  contents: read

jobs:
  build-game-dll:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout V19R branch
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply accepted cumulative Q4BSE pipeline through V19L
        shell: powershell
        run: python q4bse_port/run_q4bse_v19k_pipeline.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19N source-driven Lightning Gun runtime
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19n_lightninggun_runtime.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19O Lightning Gun parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19o_lightninggun_parity.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19P runtime parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19p_lightninggun_runtime.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19Q sustained shake and dynamic lighting overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19q_lightninggun_lighting.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19R lighting visibility fix
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19r_lightninggun_lighting_fix.py "$env:GITHUB_WORKSPACE"

      - name: Verify V19R source gates
        shell: powershell
        run: |
          Select-String -Path neo\game\Weapon.cpp -Pattern 'light.shader = NULL'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'q4_lg_shake_scale'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'coilLightOrigin'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'spireLightOrigin'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'Q4_LG_BEAM_LIGHT_COUNT'
          Select-String -Path neo\game\PlayerView.h -Pattern 'SetShakeParms'

      - name: Build Game Win32 Release
        shell: powershell
        run: msbuild neo\game.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /verbosity:minimal

      - name: Verify gamex86.dll
        shell: powershell
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'build\Win32\Release\gamex86.dll'
          if (!(Test-Path $dll)) { throw 'gamex86.dll was not produced' }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime
          Get-FileHash $dll -Algorithm SHA256

      - name: Stage V19R artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build\Win32\Release\gamex86.dll artifact\gamex86.dll
          Copy-Item neo\game\Weapon.cpp artifact\Weapon.cpp
          Copy-Item neo\game\Weapon.h artifact\Weapon.h
          Copy-Item neo\game\PlayerView.cpp artifact\PlayerView.cpp
          Copy-Item neo\game\PlayerView.h artifact\PlayerView.h
          @"
          Q4BSE V19R LIGHTNING GUN LIGHTING FIX
          =====================================
          Base: accepted V19Q.
          V19R changes:
          - keeps continuous trigger-held screen shake but lowers default scale 2.0 -> 1.6
          - q4_lg_shake_scale is now content-tunable
          - dynamic beam/coil/spire lights use idTech 4 defaultPointLight instead of animated muzzleflash shader
          - coil/spire light origins nudged outside the viewmodel mesh
          "@ | Set-Content artifact\README_TEST.txt

      - name: Upload V19R artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q4BSE-V19R-LightningGun-Lighting-Fix
          path: artifact/
          if-no-files-found: error
