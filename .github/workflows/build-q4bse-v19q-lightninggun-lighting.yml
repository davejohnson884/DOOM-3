name: Build Q4BSE V19Q Lightning Gun Lighting

on:
  workflow_dispatch:
  push:
    branches:
      - q4bse-v19q-lg-lighting
    paths:
      - 'q4bse_port/apply_q4bse_v19q_lightninggun_lighting.py'
      - '.github/workflows/build-q4bse-v19q-lightninggun-lighting.yml'

permissions:
  contents: read

jobs:
  build-game-dll:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout V19Q branch
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply accepted cumulative Q4BSE pipeline through V19L
        shell: powershell
        run: python q4bse_port/run_q4bse_v19k_pipeline.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19N source-driven Lightning Gun runtime
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19n_lightninggun_runtime.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19O Lightning Gun parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19o_lightninggun_parity.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19P runtime parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19p_lightninggun_runtime.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19Q sustained shake and dynamic lighting overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19q_lightninggun_lighting.py "$env:GITHUB_WORKSPACE"

      - name: Verify V19Q source gates
        shell: powershell
        run: |
          Select-String -Path neo\game\Weapon.cpp -Pattern 'Q4_LG_BEAM_LIGHT_COUNT'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'q4_lg_beam_light_color'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'q4_lg_coil_light_color'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'q4_lg_spire_light_color'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'gameLocal.time \+ 500'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'SetShakeParms\( MS2SEC\( gameLocal.time \), 0.0f \)'
          Select-String -Path neo\game\Weapon.h -Pattern 'Q4_LG_LIGHT_COUNT = 10'
          Select-String -Path neo\game\PlayerView.h -Pattern 'SetShakeParms'
          Select-String -Path neo\game\q4bse\Q4BSEImpactM3.cpp -Pattern 'q4LightningGunAttached'

      - name: Build Game Win32 Release
        shell: powershell
        run: msbuild neo\game.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /verbosity:minimal

      - name: Verify gamex86.dll
        shell: powershell
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'build\Win32\Release\gamex86.dll'
          if (!(Test-Path $dll)) { throw 'gamex86.dll was not produced' }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime
          Get-FileHash $dll -Algorithm SHA256

      - name: Stage V19Q artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build\Win32\Release\gamex86.dll artifact\gamex86.dll
          Copy-Item neo\game\Weapon.cpp artifact\Weapon.cpp
          Copy-Item neo\game\Weapon.h artifact\Weapon.h
          Copy-Item neo\game\PlayerView.cpp artifact\PlayerView.cpp
          Copy-Item neo\game\PlayerView.h artifact\PlayerView.h
          Copy-Item neo\game\q4bse\Q4BSEImpactM3.cpp artifact\Q4BSEImpactM3.cpp
          Copy-Item neo\game\q4bse\Q4BSEImpactM3.h artifact\Q4BSEImpactM3.h
          @"
          Q4BSE V19Q LIGHTNING GUN LIGHTING + SUSTAINED SHAKE
          ===================================================
          Base: accepted V19P.
          V19Q changes:
          - continuously refreshes Raven 500ms / scale-2 view shake while attack is held
          - clears explicit LG shake immediately when attack stops
          - six no-shadow blue point lights sample the active lightning beam
          - three small blue tube lights illuminate the charged coil area
          - one compact blue firing-spire light illuminates the top pylon cluster
          - all added renderer lights are transient and freed on weapon clear
          "@ | Set-Content artifact\README_TEST.txt

      - name: Upload V19Q artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q4BSE-V19Q-LightningGun-Lighting
          path: artifact/
          if-no-files-found: error
