name: Build Q4BSE V19N Lightning Gun

on:
  workflow_dispatch:
  push:
    branches:
      - q4bse-v19n-lg
    paths:
      - 'q4bse_port/apply_q4bse_v19n_lightninggun_runtime.py'
      - 'q4bse_port/v19n_lightning_payload.b64'
      - '.github/workflows/build-q4bse-v19n-lightninggun.yml'

permissions:
  contents: read

jobs:
  build-game-dll:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout exact V19L branch descendant
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply accepted cumulative Q4BSE pipeline through V19L
        shell: powershell
        run: python q4bse_port/run_q4bse_v19k_pipeline.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19N source-driven Lightning Gun runtime
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19n_lightninggun_runtime.py "$env:GITHUB_WORKSPACE"

      - name: Verify V19N source gates
        shell: powershell
        run: |
          Select-String -Path neo\game\Weapon.cpp -Pattern 'UpdateQ4LightningGun'
          Select-String -Path neo\game\q4bse\Q4FxParser.cpp -Pattern 'tiling'
          Select-String -Path neo\game\q4bse\Q4BSEImpactM3.cpp -Pattern 'Q4BSE_AttachPersistentEffectBetween'
          if (Select-String -Path neo\game\q4bse\Q4BSEImpactM3.cpp -Pattern 'static const float flicker\[16\]' -Quiet) { throw 'Rejected V19M randomflick source detected' }

      - name: Build Game Win32 Release
        shell: powershell
        run: msbuild neo\game.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /verbosity:minimal

      - name: Verify gamex86.dll
        shell: powershell
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'build\Win32\Release\gamex86.dll'
          if (!(Test-Path $dll)) { throw 'gamex86.dll was not produced' }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime
          Get-FileHash $dll -Algorithm SHA256

      - name: Stage V19N artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build\Win32\Release\gamex86.dll artifact\gamex86.dll
          Copy-Item neo\game\Weapon.cpp artifact\Weapon.cpp
          Copy-Item neo\game\Weapon.h artifact\Weapon.h
          Copy-Item neo\game\q4bse\Q4BSEImpactM3.cpp artifact\Q4BSEImpactM3.cpp
          Copy-Item neo\game\q4bse\Q4BSEImpactM3.h artifact\Q4BSEImpactM3.h
          Copy-Item neo\game\q4bse\Q4FxParser.cpp artifact\Q4FxParser.cpp
          Copy-Item neo\game\q4bse\Q4FxParser.h artifact\Q4FxParser.h
          @"
          Q4BSE V19N SOURCE-DRIVEN LIGHTNING GUN
          =======================================
          Base: exact accepted V19L source pipeline (V19M deliberately excluded)
          Adds Raven-style Lightning Gun beam endpoint runtime, firing-only spire FX,
          three ammo tube joints/effects, persistent impact/crawl behavior, and BSE tiling.
          "@ | Set-Content artifact\README_TEST.txt

      - name: Upload V19N artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q4BSE-V19N-LightningGun
          path: artifact/
          if-no-files-found: error
