name: Build Q4BSE V20D Clean Railgun Parity

on:
  workflow_dispatch:
  push:
    branches:
      - q4bse-v20d-railgun-clean-parity
    paths:
      - 'q4bse_port/apply_q4bse_v20d_clean_compat.py'
      - '.github/workflows/build-q4bse-v20d-railgun-clean-parity.yml'

permissions:
  contents: read

jobs:
  build-game-dll:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout V20D branch
        uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Apply accepted cumulative Q4BSE pipeline through V19L
        shell: powershell
        run: python q4bse_port/run_q4bse_v19k_pipeline.py "$env:GITHUB_WORKSPACE"
      - name: Apply V19N source-driven Lightning Gun runtime
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19n_lightninggun_runtime.py "$env:GITHUB_WORKSPACE"
      - name: Apply V19O Lightning Gun parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19o_lightninggun_parity.py "$env:GITHUB_WORKSPACE"
      - name: Apply V19P runtime parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19p_lightninggun_runtime.py "$env:GITHUB_WORKSPACE"
      - name: Apply V19Q sustained shake and dynamic lighting overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19q_lightninggun_lighting.py "$env:GITHUB_WORKSPACE"
      - name: Apply V19R lighting visibility fix
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19r_lightninggun_lighting_fix.py "$env:GITHUB_WORKSPACE"
      - name: Apply V19S impact and crawl parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19s_lightninggun_impact_parity.py "$env:GITHUB_WORKSPACE"
      - name: Apply V19V empty Lightning Gun selection fix
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19v_lightninggun_allow_empty_select.py "$env:GITHUB_WORKSPACE"
      - name: Apply V19Z Q4 cycle flashlight and Lightning ammo
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19z_q4_weapon_cycle_flashlight_ammo.py "$env:GITHUB_WORKSPACE"
      - name: Apply V19Z1 stock flashlight pickup suppression
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19z1_disable_flashlight_autoswitch.py "$env:GITHUB_WORKSPACE"
      - name: Apply V19Z2 Blaster flashlight behavior
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19z2_blaster_flashlight_logic.py "$env:GITHUB_WORKSPACE"
      - name: Apply V20A native Railgun integration
        shell: powershell
        run: python q4bse_port/apply_q4bse_v20a_railgun_native.py "$env:GITHUB_WORKSPACE"
      - name: Apply V20D clean Q4 modelDef compatibility
        shell: powershell
        run: python q4bse_port/apply_q4bse_v20d_clean_compat.py "$env:GITHUB_WORKSPACE"
      - name: Verify V20D source gates
        shell: powershell
        run: |
          Select-String -Path neo\game\anim\Anim_Blend.cpp -Pattern 'token == "rate"'
          Select-String -Path neo\game\anim\Anim_Blend.cpp -Pattern 'GetDeclPlaybackRate'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'joint_world_flash'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'joint_view_flash'
          Select-String -Path neo\game\Player.cpp -Pattern 'def_weapon13.*, "weapon_railgun"'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'q4_railgun_runtime'
      - name: Build Game Win32 Release
        shell: powershell
        run: msbuild neo\game.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /verbosity:minimal
      - name: Verify gamex86.dll
        shell: powershell
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'build\Win32\Release\gamex86.dll'
          if (!(Test-Path $dll)) { throw 'gamex86.dll was not produced' }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime
          Get-FileHash $dll -Algorithm SHA256
      - name: Stage V20D artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build\Win32\Release\gamex86.dll artifact\gamex86.dll
          Copy-Item neo\game\Player.cpp artifact\Player.cpp
          Copy-Item neo\game\Weapon.cpp artifact\Weapon.cpp
          Copy-Item neo\game\anim\Anim.h artifact\Anim.h
          Copy-Item neo\game\anim\Anim_Blend.cpp artifact\Anim_Blend.cpp
          Copy-Item neo\game\script\Script_Program.cpp artifact\Script_Program.cpp
          @"
          Q4BSE V20D - CLEAN Q4 RAILGUN PARITY
          =====================================
          V20A native Railgun gameplay/runtime retained.
          Raven modelDef rate is now supported generically by the Doom 3 host.
          Accepted Raven joint_view_* bridge retained; joint_world_* is generic too.
          No Railgun-specific presentation fallback or diagnostic branch.
          "@ | Set-Content artifact\README_TEST.txt
      - name: Upload V20D artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q4BSE-V20D-Clean-Railgun-Parity
          path: artifact/
          if-no-files-found: error
