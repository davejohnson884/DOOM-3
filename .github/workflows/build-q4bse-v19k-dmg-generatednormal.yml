name: Build Q4BSE V19M Dark Matter Lighting

on:
  workflow_dispatch:
  push:
    branches:
      - q4bse-v19k-dmg-generatednormal-fix
    paths:
      - 'q4bse_port/**'
      - 'q4bse_v16_muzzle_lock_gui.py'
      - 'q4bse_v17_q4_decal_life_bridge.py'
      - 'q4bse_v18_grenade_launcher_bse.py'
      - 'q4bse_v18b_nailgun_gui_ammo_track.py'
      - 'q4bse_v18c_machinegun_exact.py'
      - 'q4bse_v18d_machinegun_native_lower_gui_light.py'
      - 'q4bse_v18e_shotgun_joint_muzzle.py'
      - '.github/workflows/build-q4bse-v19k-dmg-generatednormal.yml'

permissions:
  contents: read

jobs:
  build-game-dll:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout V19M test branch
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply cumulative Q4BSE pipeline through V19M
        shell: powershell
        run: python q4bse_port/run_q4bse_v19k_pipeline.py "$env:GITHUB_WORKSPACE"

      - name: Stage patched core source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force source_artifact | Out-Null
          Copy-Item neo\game\q4bse\Q4BSEImpactM3.cpp source_artifact\Q4BSEImpactM3.cpp
          Copy-Item neo\game\q4bse\Q4FxParser.h source_artifact\Q4FxParser.h
          Copy-Item neo\game\q4bse\Q4FxParser.cpp source_artifact\Q4FxParser.cpp
          Copy-Item neo\game\Weapon.cpp source_artifact\Weapon.cpp
          Copy-Item neo\game\Projectile.cpp source_artifact\Projectile.cpp

      - name: Upload patched core source
        uses: actions/upload-artifact@v4
        with:
          name: Q4BSE-V19M-Patched-Core-Source
          path: source_artifact/
          if-no-files-found: error

      - name: Build Game Win32 Release
        shell: powershell
        run: |
          msbuild neo\game.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /verbosity:minimal

      - name: Verify gamex86.dll
        shell: powershell
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'build\Win32\Release\gamex86.dll'
          if (!(Test-Path $dll)) { throw "gamex86.dll was not produced at $dll" }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime
          Get-FileHash $dll -Algorithm SHA256

      - name: Stage artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build\Win32\Release\gamex86.dll artifact\gamex86.dll
          @"
          Q4BSE V19M DARK MATTER LIGHTING
          ================================
          - retains V19L Raven DMG wall-sphere orientation parity
          - adds built-in randomflick envelope support
          - Dark Matter projectile/core randomflick no longer falls back to linear
          - enables visible high-frequency travel-light flicker when authored in fly.fx
          - existing explosion/oriented generatedNormal runtime remains unchanged
          "@ | Set-Content artifact\README_TEST.txt

      - name: Upload game DLL
        uses: actions/upload-artifact@v4
        with:
          name: Q4BSE-V19M-DarkMatter-RandomFlick-Lighting
          path: artifact/
          if-no-files-found: error
