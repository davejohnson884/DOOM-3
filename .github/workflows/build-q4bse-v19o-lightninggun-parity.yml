name: Build Q4BSE V19O Lightning Gun Parity

on:
  workflow_dispatch:
  push:
    branches:
      - q4bse-v19o-lg-parity
    paths:
      - 'q4bse_port/apply_q4bse_v19o_lightninggun_parity.py'
      - '.github/workflows/build-q4bse-v19o-lightninggun-parity.yml'

permissions:
  contents: read

jobs:
  build-game-dll:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout V19O branch
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply accepted cumulative Q4BSE pipeline through V19L
        shell: powershell
        run: python q4bse_port/run_q4bse_v19k_pipeline.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19N source-driven Lightning Gun runtime
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19n_lightninggun_runtime.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19O Lightning Gun parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19o_lightninggun_parity.py "$env:GITHUB_WORKSPACE"

      - name: Verify V19O source gates
        shell: powershell
        run: |
          Select-String -Path neo\game\Weapon.cpp -Pattern 'UpdateQ4LightningGun'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'q4_bse_loop_emitters'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'do not synthesize Doom 3 projectile-style muzzle rise'
          if (Select-String -Path neo\game\Weapon.cpp -Pattern "Preserve Doom 3's accumulated muzzle-kick behavior without a fake projectile" -Quiet) { throw 'V19N Lightning Gun kick block still present' }
          Select-String -Path neo\game\q4bse\Q4BSEImpactM3.cpp -Pattern 'Q4BSE_AttachPersistentEffectBetween'

      - name: Build Game Win32 Release
        shell: powershell
        run: msbuild neo\game.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /verbosity:minimal

      - name: Verify gamex86.dll
        shell: powershell
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'build\Win32\Release\gamex86.dll'
          if (!(Test-Path $dll)) { throw 'gamex86.dll was not produced' }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime
          Get-FileHash $dll -Algorithm SHA256

      - name: Stage V19O artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build\Win32\Release\gamex86.dll artifact\gamex86.dll
          Copy-Item neo\game\Weapon.cpp artifact\Weapon.cpp
          Copy-Item neo\game\Weapon.h artifact\Weapon.h
          Copy-Item neo\game\q4bse\Q4BSEImpactM3.cpp artifact\Q4BSEImpactM3.cpp
          Copy-Item neo\game\q4bse\Q4BSEImpactM3.h artifact\Q4BSEImpactM3.h
          Copy-Item neo\game\q4bse\Q4FxParser.cpp artifact\Q4FxParser.cpp
          Copy-Item neo\game\q4bse\Q4FxParser.h artifact\Q4FxParser.h
          @"
          Q4BSE V19O LIGHTNING GUN PARITY PASS
          =====================================
          Base: accepted V19L + V19N source-driven Lightning Gun.
          V19O changes:
          - Raven-style persistent attached emitters for spire/tube electricity
          - removes synthetic Doom 3 projectile-style muzzle kick accumulation
          Content companion should restore Raven modelDef animation rates and
          use unique tube FX paths for the three simultaneously attached tubes.
          "@ | Set-Content artifact\README_TEST.txt

      - name: Upload V19O artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q4BSE-V19O-LightningGun-Parity
          path: artifact/
          if-no-files-found: error
