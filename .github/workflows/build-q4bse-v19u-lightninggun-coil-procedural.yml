name: Build Q4BSE V19U Lightning Gun Coil Procedural

on:
  workflow_dispatch:
  push:
    branches:
      - q4bse-v19u-lg-coil-procedural
    paths:
      - 'q4bse_port/apply_q4bse_v19t_lightninggun_coil_renderer.py'
      - 'q4bse_port/apply_q4bse_v19u_lightninggun_coil_procedural.py'
      - '.github/workflows/build-q4bse-v19u-lightninggun-coil-procedural.yml'

permissions:
  contents: read

jobs:
  build-game-dll:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout V19U branch
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply accepted cumulative Q4BSE pipeline through V19L
        shell: powershell
        run: python q4bse_port/run_q4bse_v19k_pipeline.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19N source-driven Lightning Gun runtime
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19n_lightninggun_runtime.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19O Lightning Gun parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19o_lightninggun_parity.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19P runtime parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19p_lightninggun_runtime.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19Q sustained shake and dynamic lighting overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19q_lightninggun_lighting.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19R lighting visibility fix
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19r_lightninggun_lighting_fix.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19S impact and crawl parity overlay
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19s_lightninggun_impact_parity.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19T narrow-fin experiment base
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19t_lightninggun_coil_renderer.py "$env:GITHUB_WORKSPACE"

      - name: Apply V19U procedural filament renderer
        shell: powershell
        run: python q4bse_port/apply_q4bse_v19u_lightninggun_coil_procedural.py "$env:GITHUB_WORKSPACE"

      - name: Verify V19U source gates
        shell: powershell
        run: |
          Select-String -Path neo\game\q4bse\Q4BSEImpactM3.cpp -Pattern 'lgun_coil_proc_core'
          Select-String -Path neo\game\q4bse\Q4BSEImpactM3.cpp -Pattern 'lgun_coil_proc_halo'
          Select-String -Path neo\game\q4bse\Q4BSEImpactM3.cpp -Pattern 'coreWidth = idMath::ClampFloat'
          Select-String -Path neo\game\q4bse\Q4BSEImpactM3.cpp -Pattern 'haloWidth = idMath::ClampFloat'
          Select-String -Path neo\game\q4bse\Q4BSEImpactM3.cpp -Pattern 'do not put a picture of lightning'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'Q4BSE_AttachEffectToEntityTransform\( crawlFx, hitEnt'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'q4_lg_shake_scale'
          Select-String -Path neo\game\Weapon.cpp -Pattern 'Q4_LG_BEAM_LIGHT_COUNT'

      - name: Build Game Win32 Release
        shell: powershell
        run: msbuild neo\game.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /verbosity:minimal

      - name: Verify gamex86.dll
        shell: powershell
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'build\Win32\Release\gamex86.dll'
          if (!(Test-Path $dll)) { throw 'gamex86.dll was not produced' }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime
          Get-FileHash $dll -Algorithm SHA256

      - name: Stage V19U artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build\Win32\Release\gamex86.dll artifact\gamex86.dll
          Copy-Item neo\game\q4bse\Q4BSEImpactM3.cpp artifact\Q4BSEImpactM3.cpp
          @"
          Q4BSE V19U LIGHTNING GUN PROCEDURAL AMMO-COIL FILAMENT
          =======================================================
          Base: accepted V19S runtime/content behavior.
          Scope: effects/weapons/lightninggun/tube* electricity only.

          V19U changes:
          - preserves Raven's generated/jittering coil centreline
          - stops sampling lgun_smallbolt or any bolt-image texture for tube electricity
          - draws an ultra-thin crossed white/blue core directly along the path
          - draws one slightly wider, very faint cyan halo strip along the same path
          - existing coil point light supplies broad illumination
          - glass, main beam, spire, impact/crawl, shake, damage, sound unchanged
          "@ | Set-Content artifact\README_TEST.txt

      - name: Upload V19U artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q4BSE-V19U-LightningGun-Coil-Procedural
          path: artifact/
          if-no-files-found: error
